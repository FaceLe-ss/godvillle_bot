name = "godville-boss-bot"
main = "src/index.js"
compatibility_date = "2026-05-24"

[assets]
directory = "../webapp"
binding = "ASSETS"
run_worker_first = ["/api/*", "/telegram/*", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "godville-boss-db"
database_id = "876c14fc-1b80-4b12-8c79-bee7d8fd40ef"

[triggers]
crons = ["* * * * *"]

[vars]
GODVILLE_BASE_URL = "https://godville.net"
ALLOWED_TELEGRAM_IDS = ""
